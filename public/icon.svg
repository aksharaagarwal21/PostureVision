  </g>
  <circle cx="246" cy="126" r="40" fill="#ffffff"/>
  <!-- Tracking dots on the joints -->
  <g fill="#22c55e" stroke="#ffffff" stroke-width="8">
    <circle cx="224" cy="304" r="20"/>
    <circle cx="150" cy="262" r="20"/>
  </g>
